<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: #f7f4ef;
      color: #3d3832;
      padding: 40px 20px;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #2c2621;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .slogan {
      color: #8a7968;
      font-size: 16px;
      font-style: italic;
      margin-top: 0;
      margin-bottom: 35px;
    }

    /* Beneficios de la tienda */
    .beneficios {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      background-color: #4a4037;
      color: #f7f4ef;
      padding: 14px;
      margin-bottom: 40px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .beneficios span {
      font-size: 13px;
    }

    /* Catálogo */
    #productos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .producto {
      border: 1px solid #e3ded5;
      background: #ffffff;
      border-radius: 8px;
      padding: 16px;
      width: 220px;
      vertical-align: top;
      box-shadow: 0 4px 12px rgba(61, 56, 50, 0.04);
    }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }

    .producto h3 {
      color: #2c2621;
      margin: 12px 0 8px 0;
      font-size: 16px;
    }

    .descripcion {
      font-size: 13px;
      color: #7a7065;
      min-height: 42px;
    }

    .precio {
      font-size: 17px;
      font-weight: bold;
      color: #8c6d53;
      margin: 10px 0;
    }

    /* Botones */
    .producto button {
      background-color: #5c4d3d;
      border: none;
      color: white;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
    }

    .producto button:hover {
      background-color: #4a4037;
    }

    /* Carrito */
    .carrito {
      margin-top: 50px;
      padding: 25px;
      background: #ffffff;
      border: 1px solid #e3ded5;
      border-radius: 8px;
      text-align: left;
      display: inline-block;
      min-width: 320px;
      box-shadow: 0 4px 12px rgba(61, 56, 50, 0.04);
    }

    .carrito h2 {
      margin-top: 0;
      color: #2c2621;
    }

    #lista-carrito {
      padding-left: 20px;
      font-size: 14px;
      color: #555;
    }

    #lista-carrito li {
      margin-bottom: 8px;
    }

    .resumen {
      border-top: 1px solid #e3ded5;
      margin-top: 20px;
      padding-top: 15px;
    }

    .total {
      font-size: 18px;
      color: #2c2621;
    }

    /* Botón vaciar */
    .vaciar {
      background-color: transparent;
      border: 1px solid #b57a73;
      color: #a85c53;
      padding: 9px 12px;
      margin-top: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .vaciar:hover {
      background-color: #b57a73;
      color: white;
    }

    /* Botón finalizar */
    .finalizar {
      background-color: #8c6d53;
      border: none;
      color: white;
      padding: 9px 12px;
      margin-top: 10px;
      margin-left: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .finalizar:hover {
      background-color: #5c4d3d;
    }
  </style>
</head>
<body>
  <div style="background-color: #fbfbfb; color: #111111; border-left: 2px solid #b8860b; padding: 36px 32px; max-width: 700px; margin: 0 auto; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.04);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <span style="font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: #888888;"></span>
      <span style="font-size: 12px; letter-spacing: 1px; color: #b8860b; font-weight: 500;">Ingrid Ximena Diaz</span>
    </div>
    <h1 style="font-size: 28px; font-weight: 300; margin: 0 0 16px 0; letter-spacing: 2px; text-transform: uppercase;">
      Hermès Luxury Edit
    </h1>
    <p style="font-size: 14px; color: #555555; margin: 0; font-weight: 300; letter-spacing: 0.5px; line-height: 1.6;">
      “La elegancia no es destacar, sino ser recordado a través del tiempo.”
    </p>
  </div>

  <div class="beneficios">
    <span>🚚 Envíos en Bogotá</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de pedido</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Birkin Hermes",
        descripcion: "Es un estuche alargado de piel de becerro Swift de Hermès, diseñado con el estampado ecuestre LÉpopée dHermès para llevar teléfonos móviles y tarjetas de forma elegante.",
        precio: 150000000,
        imagen: "https://assets.hermes.com/is/image/hermesedito/087292CKAA_front_wm_1%20%281%29?fit=wrap%2C0&wid=768&resMode=sharp2&op_usm=1%2C1%2C6%2C0"
      },
      {
        id: 2,
        nombre: "Colgante Oro rosa",
        descripcion: "Es el colgante Clou d'H de Hermès, una elegante joya de oro con detalles en forma de tachuela inspirada en la tradición ecuestre de la marca.",
        precio: 95000000,
        imagen: "https://assets.hermes.com/is/image/hermesproduct/colgante-hermes-clou-d-h--223208B%2000-worn-1-0-0-800-800_g.jpg"
      },
      {
        id: 3,
        nombre: "Reloj Cape Code",
        descripcion: "Es un reloj Cape Cod Mini de Hermès, caracterizado por su emblemática caja en forma de ancla de barco y su correa de doble vuelta.",
        precio: 98000000,
        imagen: "https://assets.hermes.com/is/image/hermesproduct/reloj-cape-cod-tamano-mini-27mm--408369WW00-front-wm-1-0-0-800-800_g.jpg"
      },
      {
        id: 4,
        nombre: "Perfume Eau des Mervilles",
        descripcion: "Es una bruma perfumada para el cabello Eau des Merveilles de Hermès, diseñada para perfumar delicadamente el cabello con las notas amaderadas y ambarinas de la fragancia.",
        precio: 15000000,
        imagen: "https://assets.hermes.com/is/image/hermesproduct/eau-des-merveilles-bruma-perfumada-para-el-cabello--108145V0-worn-1-0-0-800-800_g.jpg"
      },
      {
        id: 5,
        nombre: "Abrigo Modulable",
        descripcion: "Es un abrigo modulable de inspiración gabardina de Hermès, una prenda versátil y sofisticada que combina las líneas clásicas de una gabardina tradicional con un diseño contemporáneo.",
        precio: 7500000,
        imagen: "https://assets.hermes.com/is/image/hermesproduct/abrigo-modulable-de-inspiracion-gabardina--6H0140DAA3-worn-2-0-0-800-800_g.jpg"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
